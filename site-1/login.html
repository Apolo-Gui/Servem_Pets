<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tela de Login</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #974C1C;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh; /* Define a altura da tela como 100% da viewport */
    overflow-y: auto; /* Adicionado para permitir rolagem vertical */
  }

  a {
    text-decoration: none;
    color:#974C1C;
  }

  .login-card {
    background-color: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.1);
    text-align: center;
    position: relative;
    max-width: 400px; /* Adicionado para limitar a largura do card */
  }

  .login-card h1 {
    color: #974C1C;
  }

  .login-card img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin-bottom: 20px;
  }

  .login-card form {
    display: flex;
    flex-direction: column;
  }

  .login-card input[type="text"],
  .login-card input[type="password"] {
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
  }

  .login-card input[type="submit"] {
    padding: 10px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    background-color: #974C1C;
    color: white;
    cursor: pointer;
  }

  .login-card input[type="submit"]:hover {
    background-color: #EACCA8;
  }
</style>
</head>
<body>

<div class="login-card">
  <img src="asset/images/1221.jpg" alt="Logo">
  <h1>Login</h1>
  <form>
    <input type="text" placeholder="Usuário">
    <input type="password" placeholder="Senha">
    <input type="submit" value="Entrar">
    <br>
    <a href="#" target="_blank">Esqueci a Senha</a>
    <a href="#" target="_blank">Cadastre-se</a>
  </form>
</div>

</body>
</html>
