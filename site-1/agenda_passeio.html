<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="asset/css/passeio.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h2 class="title">Agendamento</h2>
        <div class="card">
          <div class="card-header">
            <div class="card-title">Data</div>
            <input type="date" class="input-field" />
          </div>
          <div class="card-content">
            <div class="card">
              <div class="card-header">
                <div class="card-title">Hora</div>
                <input type="time" class="input-field" />
              </div>
            </div>
            <div class="card">
              <div class="card-header">
                <div class="card-title">Escolha um Profissional</div>
              </div>
              <div class="card-content">
                <div class="checkbox-container">
                  <input type="checkbox" class="input-field" id="Profissional1" />
                  <label for="Profissional1" class="checkbox-label">Luis Henrique Oliveira da Silva</label>
                </div>
                <div class="checkbox-container">
                  <input type="checkbox" class="input-field" id="Profissional2" />
                  <label for="Profissional2" class="checkbox-label">Sávio Machado do Valle</label>
                </div>
              </div>
            </div>
          </div>
          <div class="button-container">
            <button class="button">Agendar</button>
          </div>
        </div>
      </div>
</body>
</html>
