<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tela de Cadastro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<link rel="icon" href="/site-1/asset/images/1221.jpg">
<style>
@import url("https://fonts.cdnfonts.com/css/pp-neue-montreal");
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700&display=swap");
@import url("https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap");
@import url("https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&family=Racing+Sans+One&family=Rowdies:wght@300;400;700&family=Sacramento&display=swap");
@import url("https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&family=Racing+Sans+One&family=Sacramento&display=swap");


  body {
    margin: 0;
    padding: 0;
    font-family: 'Rowdies', Arial, sans-serif;
    background-color: #974C1C;
    overflow-y: auto; 
    cursor: url("asset/images/1221.jpg") auto;
  }

  .register-card {
    background-color: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.1);
    text-align: center;
    position: relative;
    margin: 25px auto; 
    max-width: 400px; 
  }

  .register-card h1 {
    color: #974C1C;
  }

  .register-card img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin: 0 auto 20px; 
    display: block; 
  }

  .register-card form {
    display: flex;
    flex-direction: column;
  }

  .register-card input[type="text"],
  .register-card input[type="email"],
  .register-card input[type="password"],
  .register-card input[type="date"],
  .register-card input[type="tel"] {
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
    position: relative;
  }

  .password-wrapper {
    position: relative;
  }

  .password-toggle {
    position: absolute;
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
    cursor: pointer;
    color: #ccc;
  }

  .register-card button[type="submit"] {
    padding: 10px;
    border: none;
    border-radius: 5px;
    font-size: 35px;
    background-color: #974C1C;
    color: white;
    cursor: pointer;
  }

  .register-card button[type="submit"]:hover {
    background-color: #EACCA8;
  }

  .error-message {
    color: red;
    margin-top: 5px;
  }

  input {
    color:grey;
  }
</style>
</head>
<body>

<div class="register-card">
  <img src="asset/images/1221.jpg" alt="Logo">
  <h1>Cadastro</h1>
  <form id="cadastroForm">
    <input type="text" placeholder="Nome Completo" required>
    <input type="email" placeholder="Email" required>
    <input type="date" placeholder="Data de Nascimento" required>
    <input type="text" placeholder="CEP (XXXXX-XXX)" pattern="[0-9]{5}-[0-9]{3}" required>
    <input type="text" placeholder="CPF (11 dígitos)" pattern="[0-9]{11}" required>
    <input type="tel" placeholder="Telefone (XX XXXXX-XXXX)" pattern="[0-9]{2} [0-9]{5}-[0-9]{4}" required>
    <div class="password-wrapper">
      <input type="password" id="senha" placeholder="Senha" required>
      <i class="fas fa-eye password-toggle" id="togglePassword"></i>
    </div>
    <div class="password-wrapper">
      <input type="password" id="confirmarSenha" placeholder="Confirmar Senha" required>
      <i class="fas fa-eye password-toggle" id="toggleConfirmPassword"></i>
    </div>
    <span class="error-message" id="passwordError" style="display: none;">As senhas não coincidem.</span>
    <button class="register-card" onclick="window.location.href = '/site-1/conclusao_cadastro.html';" type="submit">Cadastrar</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-auth-compat.js"></script>
<script src="firebase-init.js"></script>

<script src="index.js"></script>
<script src="validations.js"></script>
<script src="loading.js"></script>

<script>
  document.getElementById("cadastroForm").addEventListener("submit", function(event) {
    var senhaInput = document.getElementById("senha");
    var confirmarSenhaInput = document.getElementById("confirmarSenha");
    var passwordError = document.getElementById("passwordError");

    if (senhaInput.value !== confirmarSenhaInput.value) {
      passwordError.style.display = "block";
      event.preventDefault(); 
    } else {
      passwordError.style.display = "none";
    }
  });

  document.getElementById("togglePassword").addEventListener("click", function() {
    var senhaInput = document.getElementById("senha");
    if (senhaInput.type === "password") {
      senhaInput.type = "text";
      this.classList.remove("fa-eye");
      this.classList.add("fa-eye-slash");
    } else {
      senhaInput.type = "password";
      this.classList.remove("fa-eye-slash");
      this.classList.add("fa-eye");
    }
  });

  document.getElementById("toggleConfirmPassword").addEventListener("click", function() {
    var confirmarSenhaInput = document.getElementById("confirmarSenha");
    if (confirmarSenhaInput.type === "password") {
      confirmarSenhaInput.type = "text";
      this.classList.remove("fa-eye");
      this.classList.add("fa-eye-slash");
    } else {
      confirmarSenhaInput.type = "password";
      this.classList.remove("fa-eye-slash");
      this.classList.add("fa-eye");
    }
  });
</script>

</body>
</html>
