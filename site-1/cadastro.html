<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tela de Cadastro</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #974C1C;
    overflow-y: auto; 
  }

  .register-card {
    background-color: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.1);
    text-align: center;
    position: relative;
    margin: 100px auto; 
    max-width: 400px; 
  }

  .register-card h1 {
    color: #974C1C;
  }

  .register-card img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin: 0 auto 20px; 
    display: block; 
  }

  .register-card form {
    display: flex;
    flex-direction: column;
  }

  .register-card input[type="text"],
  .register-card input[type="email"],
  .register-card input[type="password"],
  .register-card input[type="date"],
  .register-card input[type="tel"] {
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
  }

  .register-card input[type="submit"] {
    padding: 10px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    background-color: #974C1C;
    color: white;
    cursor: pointer;
  }

  .register-card input[type="submit"]:hover {
    background-color: #EACCA8;
  }
</style>
</head>
<body>

<div class="register-card">
  <img src="asset/images/1221.jpg" alt="Logo">
  <h1>Cadastro</h1>
  <form id="cadastroForm">
    <input type="text" placeholder="Nome Completo" required>
    <input type="email" placeholder="Email" required>
    <input type="date" placeholder="Data de Nascimento" required>
    <input type="text" placeholder="Endereço" required>
    <input type="text" placeholder="CPF" required>
    <input type="tel" placeholder="Número de Telefone" required>
    <input type="password" placeholder="Senha" required>
    <input type="password" placeholder="Confirmar Senha" required>
    <input type="submit" value="Cadastrar">
  </form>
</div>

<script>
  document.getElementById("cadastroForm").addEventListener("submit", function(event) {
    event.preventDefault(); 
    window.location.href = 'conclusao_cadastro.html'; 
  });
</script>

</body>
</html>
